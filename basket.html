<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basket · J. Ben G</title>
  <link rel="icon" href="img/logo-j-ben-g.png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#14241c; --muted:#5c6d63; --green:#143226; --gold:#b8923e; --line:#e6ebe7; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Outfit,system-ui,sans-serif; color:var(--ink); }
    a { color:inherit; }
    .wrap { max-width:760px; margin:0 auto; padding:0 20px 40px; }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--line); }
    header img { width:108px; }
    nav a { margin-left:16px; text-decoration:none; font-weight:500; }
    h1 { margin:28px 0 8px; letter-spacing:-.03em; }
    p { color:var(--muted); }
    ul { list-style:none; margin:18px 0; }
    li { display:flex; justify-content:space-between; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
    button { background:none; border:0; color:var(--green); font:inherit; font-weight:600; cursor:pointer; }
    .note { background:#f7f6f3; border-radius:16px; padding:16px; margin-top:16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="index.html"><img src="img/logo-j-ben-g.png" alt="J. Ben G" /></a>
      <nav><a href="shop.html">Shop</a></nav>
    </header>
    <h1>Basket</h1>
    <p>Items stay in this browser until you remove them.</p>
    <ul id="lines"></ul>
    <p id="totals" style="margin-top:12px"></p>
    <div class="note">
      <p id="pay-note">Delivery is £9.99. Free on goods of £50 or more. Another £9.99 over 20kg.</p>
      <p style="margin-top:12px"><button id="pay" style="background:#143226;color:#fff;border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer">PAY</button></p>
    </div>
  <p style="margin-top:18px;color:#5c6d63">Website built by J. Ben G</p>
  </div>
  <script src="basket.js"></script>
  <script>
    const list = document.getElementById("lines");
    const money = { software: 199, satya: 4.5 };
    const weight = { satya: 0.2 };
    function moneyText(n) { return "£" + n.toFixed(2); }
    function draw() {
      const items = window.JBG.list();
      list.innerHTML = "";
      const totals = document.getElementById("totals");
      if (!items.length) {
        list.innerHTML = "<li><span>The basket is empty.</span></li>";
        totals.textContent = "";
        return;
      }
      items.forEach((item) => {
        const li = document.createElement("li");
        const name = document.createElement("span");
        name.textContent = item.name + " × " + item.qty;
        const btn = document.createElement("button");
        btn.textContent = "Remove";
        btn.addEventListener("click", () => {
          window.JBG.remove(item.id);
          draw();
        });
        li.appendChild(name);
        li.appendChild(btn);
        list.appendChild(li);
      });
      let goods = 0, kilos = 0;
      items.forEach((item) => {
        goods += (money[item.id] || 0) * item.qty;
        kilos += (weight[item.id] || 0) * item.qty;
      });
      const boxes = kilos ? Math.max(1, Math.ceil(kilos / 20)) : 0;
      const chargeable = goods >= 50 ? Math.max(0, boxes - 1) : boxes;
      const delivery = chargeable * 9.99;
      totals.textContent = "Goods " + moneyText(goods) + " · Delivery " + moneyText(delivery) + " · Total " + moneyText(goods + delivery);
    }
    draw();
    const params = new URLSearchParams(location.search);
    if (params.get("paid") === "1") {
      localStorage.removeItem("jbg-basket");
      document.getElementById("pay-note").textContent = "Payment received. The basket has been cleared.";
      draw();
    }
    document.getElementById("pay").addEventListener("click", async () => {
      const note = document.getElementById("pay-note");
      const items = window.JBG.list();
      if (!items.length) {
        note.textContent = "The basket is empty.";
        return;
      }
      note.textContent = "Opening payment...";
      try {
        const response = await fetch("/api/checkout", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items })
        });
        const data = await response.json();
        if (data.url) location.href = data.url;
        else note.textContent = "Payment could not open.";
      } catch (e) {
        note.textContent = "Payment could not open.";
      }
    });
  </script>
</body>
</html>
