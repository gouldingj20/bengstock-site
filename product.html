<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product · J. Ben G</title>
  <link rel="icon" href="img/logo-j-ben-g.png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#14241c; --muted:#5c6d63; --green:#143226; --gold:#b8923e; --line:#e6ebe7; --bg:#f7f6f3; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Outfit,system-ui,sans-serif; color:var(--ink); background:#fff; }
    a { color:inherit; }
    img { max-width:100%; display:block; }
    .wrap { max-width:1080px; margin:0 auto; padding:0 20px; }
    header { display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--line); }
    header img { width:108px; }
    nav { display:flex; gap:20px; align-items:center; }
    nav a { text-decoration:none; font-weight:500; color:#31443a; }
    .buy { background:var(--green); color:#fff !important; padding:10px 16px; border-radius:999px; font-weight:600; text-decoration:none; display:inline-block; }
    .count { background:var(--gold); color:#1a1408; border-radius:99px; font-size:11px; padding:1px 6px; margin-left:4px; }
    .crumb { margin:22px 0 8px; color:var(--muted); font-size:.92rem; }
    .crumb a { color:var(--green); text-decoration:none; font-weight:600; }
    .product { display:grid; grid-template-columns:1.05fr .95fr; gap:28px; padding:8px 0 48px; align-items:start; }
    .photo { background:var(--bg); border-radius:20px; overflow:hidden; border:1px solid var(--line); }
    .photo img { width:100%; height:460px; object-fit:contain; }
    .eyebrow { letter-spacing:.14em; text-transform:uppercase; font-size:12px; font-weight:600; color:var(--gold); margin-bottom:8px; }
    h1 { font-size:clamp(2rem,4vw,2.8rem); letter-spacing:-.03em; margin-bottom:8px; }
    .price { font-size:1.6rem; font-weight:700; margin:10px 0; }
    .status { display:inline-block; border-radius:999px; padding:4px 10px; font-size:.82rem; font-weight:600; margin-bottom:12px; }
    .in { background:#e7f4ec; color:#143226; }
    .out { background:#f4ece7; color:#6b4a32; }
    .desc { color:var(--muted); font-size:1.05rem; line-height:1.55; margin-bottom:14px; }
    .points { list-style:none; margin:0 0 18px; }
    .points li { padding:6px 0 6px 14px; position:relative; color:#31443a; }
    .points li::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--gold); position:absolute; left:0; top:.7rem; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:8px; }
    input[type="number"] { width:72px; border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; }
    .site-buy { background:var(--green); color:#fff; border:0; border-radius:999px; padding:12px 18px; font:inherit; font-weight:600; cursor:pointer; }
    .note { margin-top:16px; color:var(--muted); font-size:.92rem; }
    footer { border-top:1px solid var(--line); padding:18px 0 28px; color:var(--muted); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    footer a { color:var(--green); font-weight:600; text-decoration:none; }
    @media (max-width:800px) {
      .product { grid-template-columns:1fr; }
      .photo img { height:280px; }
      nav a:not(.buy):not(.basket-link) { display:none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="index.html"><img src="img/logo-j-ben-g.png" alt="J. Ben G" /></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a class="basket-link" href="basket.html">Basket <span class="count" data-count>0</span></a>
        <a class="buy" href="https://www.ebay.co.uk/usr/j.bengukshop" target="_blank" rel="noopener">My eBay</a>
      </nav>
    </header>
    <p class="crumb"><a href="shop.html">Shop</a> / <span id="crumb-name">Product</span></p>
    <section class="product" id="product"></section>
    <footer>
      <div>© 2026 J. Ben G · <a href="privacy.html">Privacy</a></div>
      <a href="basket.html">View basket</a>
    </footer>
  </div>
  <script src="basket.js"></script>
  <script>
    const products = {
      software: {
        name: "BenGStock",
        cat: "Software",
        image: "img/preview-dashboard.jpg",
        price: "£250 a year",
        inStock: true,
        id: "software",
        desc: "Stock control for Linux. Stock, purchasing, goods received and cash, kept on your own computer. One year of use. A new key is sent with every renewal.",
        points: ["One year of use", "Key matched to your machine", "Updates included for the year", "Ready to install on Linux"]
      },
      satya: {
        name: "Satya incense",
        cat: "Incense",
        image: "img/products/satya.jpg",
        price: "£1.99",
        inStock: true,
        id: "satya",
        desc: "Satya incense sticks for home. A simple, familiar stick for a room, a shelf or a quiet evening.",
        points: ["In stock", "UK delivery", "Free UK delivery on orders of £25 or more"]
      },
      holder: {
        name: "Incense holder",
        cat: "Household",
        image: "img/products/holder.jpg",
        price: "Coming soon",
        inStock: false,
        desc: "A tray holder for incense sticks. Useful on a shelf, desk or windowsill, and easy to empty.",
        points: ["Tray style", "For incense sticks", "Not in stock yet"]
      },
      "holder-round": {
        name: "Round incense holder",
        cat: "Household",
        image: "img/products/holder-round.jpg",
        price: "Coming soon",
        inStock: false,
        desc: "A small stand for a single incense stick. Neat on a table or beside a plant.",
        points: ["Single stick", "Compact", "Not in stock yet"]
      },
      candle: {
        name: "Jar candle",
        cat: "Household",
        image: "img/products/candle.jpg",
        price: "Coming soon",
        inStock: false,
        desc: "A jar candle for the house. A simple everyday scent, not a seasonal one-off.",
        points: ["Jar candle", "For the home", "Not in stock yet"]
      },
      mailers: {
        name: "Mailing bags",
        cat: "Packaging",
        image: "img/products/mailers.jpg",
        price: "Coming soon",
        inStock: false,
        desc: "Plain postal mailers for small orders. Useful if you send from home.",
        points: ["Plain mailers", "For posting", "Not in stock yet"]
      },
      boxes: {
        name: "Postal boxes",
        cat: "Packaging",
        image: "img/products/boxes.jpg",
        price: "Coming soon",
        inStock: false,
        desc: "Kraft cartons for packing orders. Strong enough for the post, plain enough for anything.",
        points: ["Kraft cartons", "For orders", "Not in stock yet"]
      },
      tape: {
        name: "Packing tape",
        cat: "Packaging",
        image: "img/products/tape.jpg",
        price: "Coming soon",
        inStock: false,
        desc: "Packing tape for sealing boxes and mailers.",
        points: ["For sealing", "Everyday packing", "Not in stock yet"]
      },
      bubble: {
        name: "Bubble wrap",
        cat: "Packaging",
        image: "img/products/bubble.jpg",
        price: "Coming soon",
        inStock: false,
        desc: "Bubble wrap for protecting small items in the post.",
        points: ["Protective packing", "For small items", "Not in stock yet"]
      },
      tissue: {
        name: "Tissue paper",
        cat: "Packaging",
        image: "img/products/tissue.jpg",
        price: "Coming soon",
        inStock: false,
        desc: "Kraft tissue for wrapping and packing. A quiet finish inside a box or bag.",
        points: ["Kraft tissue", "For wrapping", "Not in stock yet"]
      },
      labels: {
        name: "Address labels",
        cat: "Packaging",
        image: "img/products/labels.jpg",
        price: "Coming soon",
        inStock: false,
        desc: "Address labels for parcels and envelopes.",
        points: ["For parcels", "Plain labels", "Not in stock yet"]
      }
    };
    const id = new URLSearchParams(location.search).get("id") || "software";
    const item = products[id] || products.software;
    document.title = item.name + " · J. Ben G";
    document.getElementById("crumb-name").textContent = item.name;
    const status = item.inStock ? '<span class="status in">In stock</span>' : '<span class="status out">Out of stock</span>';
    const buy = item.inStock
      ? '<div class="row"><input type="number" min="1" value="1" data-qty /><button class="site-buy" data-add="' + item.id + '" data-name="' + item.name + '">Add to basket</button></div>'
      : '<p class="note">This line is not in stock yet. <a href="mailto:enquiries@bengstock.com">Ask when it returns.</a></p>';
    document.getElementById("product").innerHTML =
      '<div class="photo"><img src="' + item.image + '" alt="' + item.name + '" /></div>' +
      '<div><p class="eyebrow">' + item.cat + '</p><h1>' + item.name + '</h1>' + status +
      '<p class="price">' + item.price + '</p><p class="desc">' + item.desc + '</p>' +
      '<ul class="points">' + item.points.map((p) => '<li>' + p + '</li>').join('') + '</ul>' + buy + '</div>';
  </script>
</body>
</html>
